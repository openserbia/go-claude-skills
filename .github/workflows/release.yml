name: Release

on:
  push:
    branches: [main]
    paths:
      - "golang-*/**"
      - "Taskfile.yml"
      - "devbox.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint
        run: devbox run -- task lint

      - name: Validate
        run: devbox run -- task validate

  release:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            # Increment patch: v1.2.3 -> v1.2.4
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
            PATCH=$((PATCH + 1))
            echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          fi
          echo "prev=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          TAG=${{ steps.version.outputs.tag }}
          PREV_TAG=${{ steps.version.outputs.prev }}

          {
            echo "notes<<EOF"

            devbox run -- task stats

            echo ""
            echo "## Changes"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s" "$PREV_TAG".."$TAG" -- '*.md' 'golang-*/' 'Taskfile.yml' 'devbox.json'
            else
              git log --pretty=format:"- %s" "$TAG"
            fi

            echo ""
            echo ""
            echo "## Skills"
            echo ""
            for dir in golang-*/; do
              name=$(grep "^name:" "$dir/SKILL.md" | head -1 | sed 's/name: *//' | tr -d '"')
              desc=$(grep "^description:" "$dir/SKILL.md" | head -1 | sed 's/description: *//' | tr -d '"' | cut -c1-100)
              echo "- **$name** — $desc"
            done

            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "npx skills add openserbia/go-claude-skills -g -y"
            echo '```'

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false

name: Release

on:
  push:
    branches: [main]
    paths:
      - "golang-*/**"
      - "Taskfile.yml"
      - "devbox.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Lint
        run: devbox run -- task lint

      - name: Validate
        run: devbox run -- task validate

  release:
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            # Increment patch: v1.2.3 -> v1.2.4
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
            PATCH=$((PATCH + 1))
            echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          fi
          echo "prev=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          PREV_TAG=${{ steps.version.outputs.prev }}

          # Stats table — only capture the markdown table lines, skip devbox noise
          devbox run -- task stats 2>/dev/null | grep -E '^\|' > /tmp/release-notes.md

          echo "" >> /tmp/release-notes.md
          echo "## Changes" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md

          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> /tmp/release-notes.md
          else
            git log --pretty=format:"- %s" HEAD >> /tmp/release-notes.md
          fi

          {
            echo ""
            echo ""
            echo "## Skills"
            echo ""
          } >> /tmp/release-notes.md

          for dir in golang-*/; do
            name=$(grep "^name:" "$dir/SKILL.md" | head -1 | sed 's/name: *//' | tr -d '"')
            desc=$(grep "^description:" "$dir/SKILL.md" | head -1 | sed 's/description: *//' | tr -d '"' | cut -c1-100)
            echo "- **${name}** — ${desc}" >> /tmp/release-notes.md
          done

          {
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo 'npx skills add openserbia/go-claude-skills -g -y'
            echo '```'
          } >> /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md

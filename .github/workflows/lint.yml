name: Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Lint markdown
        run: devbox run -- task lint:md

      - name: Check formatting
        run: devbox run -- task lint:fmt

      - name: Validate skill structure
        run: devbox run -- task validate

      - name: Check broken links
        run: devbox run -- task check:links

      - name: Skill stats
        run: devbox run -- task stats

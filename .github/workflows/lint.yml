name: Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0

      - name: Lint markdown
        run: devbox run -- task lint:md

      - name: Check formatting
        run: devbox run -- task lint:fmt

      - name: Validate skill structure
        run: devbox run -- task validate

      - name: Check broken links
        run: devbox run -- task check:links

      - name: Skill stats
        run: devbox run -- task stats
